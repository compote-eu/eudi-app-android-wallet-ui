# A full "assemble with tests" build dex-merges every module's androidTest concurrently; D8
# dex-merge runs in-process in the Gradle daemon, so on high-core machines many run at once and
# exhaust the heap. Two levers together give reliable headroom: cap concurrent workers to 8 AND
# give the daemon 12 GB. (8 GB + 8 workers was flaky — peak sat right at 8 GB.) workers.max has
# no effect on CI runners with <=8 cores; 12 GB is a ceiling, not preallocated.
org.gradle.jvmargs=-Xmx12288m -Dfile.encoding=UTF-8
org.gradle.workers.max=8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
toolChainResolverVersion=1.0.0
org.gradle.configuration-cache=true