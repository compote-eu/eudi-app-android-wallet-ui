# Single source of truth for the app version on BOTH platforms.
#
# VERSION_NAME is upstream's CalVer placeholder, replaced at release time by fastlane's `set_version`
# lane with "%Y.%m.<buildCode>" (e.g. 2026.08.41) and restored by `reset_versionName`. It is committed
# as the placeholder on purpose, so a locally built app shows `yyyy.mm.v` on the settings screen — the
# official native iOS wallet commits the identical placeholder as its MARKETING_VERSION.
#
#   Android  versionName + BuildConfig.APP_VERSION   (build-logic's `configureFlavors`)
#   iOS      MARKETING_VERSION -> CFBundleShortVersionString   (iosApp/project.yml)
#
# ⚠️ VERSION_CODE is a fork addition: upstream keeps it as a literal in androidApp/build.gradle.kts,
# which fastlane's `increment_version_code` / `reset_versioncode` lanes edit in place. Reading it from
# here instead is what lets one edit move both platforms, and it makes those two lanes inert — a
# release pipeline must write this file rather than the Gradle script.
#
#   Android  versionCode                             (androidApp/build.gradle.kts)
#   iOS      CURRENT_PROJECT_VERSION -> CFBundleVersion   (iosApp/project.yml)
#
# iOS reads these through XcodeGen's generate-time `${...}` expansion, so both files are consumed by
# `./gradlew generateIosProject` — see iosApp/project.yml.
VERSION_NAME=yyyy.mm.v
VERSION_CODE=1
