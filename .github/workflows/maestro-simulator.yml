name: Maestro Simulator

# Rewritten from scratch for this KMP repo on 2026-09-28. The file this replaced was the
# `eudi-app-ios-wallet-ui` sibling project's own CI workflow, copied in wholesale along with the
# rest of the unverified `.maestro/` reference material — it referenced a nonexistent
# `EudiReferenceWallet.xcodeproj`, the wrong scheme/appId, and had no Android job at all. See
# `wiki/BRANCHES.md` for why this repo carries copied-but-unadapted material from that project.
#
# Scoped deliberately narrow: the ONLY flow either job runs is
# `.maestro/kmp/issuance/tc-01-pid-issuance-common.yaml` — the single flow that has actually been
# built and verified, unmodified, against this app's real screens on both platforms (see
# `.maestro/PORTING_STATUS.md`, TC-01's row). Every other file under `.maestro/` (including the
# Android continuation file for TC-01 itself) is either unverified reference material or, in the
# continuation file's specific case, now KNOWN STALE — see the note on that further down and in
# this PR/commit's own description. Add more flows here only once they've been through the same
# live "screenshot → hierarchy dump → flow snippet" verification discipline as this one, not
# straight from the reference copies.
#
# Two independent jobs, not one with two platforms inline: android-tests and ios-tests each stand
# on their own so a failure in one doesn't hide whether the other (shared-flow-file) side is
# still green — see ios-tests' `if: always()` below.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tests:
    name: Android — Maestro (TC-01 common flow)
    # Custom label, not bare `self-hosted`: confirmed against the runner's actual registered
    # labels (self-hosted, macOS, ARM64, maestro, mobile-e2e) — `maestro` is provisioned
    # specifically for this kind of workflow, not any self-hosted runner in the fleet, matching
    # the already-decided security posture of scoping runner access per-workload.
    runs-on: [self-hosted, macOS, maestro]
    permissions:
      contents: read
    # Generous ceiling, not an expected duration — the flow itself normally finishes in well
    # under 5 minutes (confirmed interactively this session: PIN setup through the document
    # catalog, unmodified, passes in seconds). Sized to comfortably absorb a cold Gradle build,
    # not to tolerate a hung Maestro driver — that failure mode is bounded separately, and much
    # more tightly, on the flow-run step itself below.
    timeout-minutes: 30
    env:
      # Confirmed live on the machine this workflow was authored on (echo $ANDROID_HOME →
      # /Users/martin.cekan/Library/Android/sdk) — but that's this session's interactive dev
      # shell, not necessarily the actual self-hosted CI runner's account/home directory. If the
      # runner logs in as a different user (e.g. a dedicated `runner`/`ci` account), this path's
      # username segment will need adjusting — check `echo $ANDROID_HOME` on the real runner
      # before trusting this as-is.
      ANDROID_HOME: /Users/martin.cekan/Library/Android/sdk
      # Confirmed real, not a placeholder: this is the exact AVD actively running and used for
      # today's live TC-01 re-verification on this machine — cross-checked two ways
      # (`ps aux | grep qemu` showing `-avd Pixel_6a`, and `adb -s emulator-5554 emu avd name` →
      # `Pixel_6a`). Still not independently confirmed to exist on the actual CI runner's AVD
      # list — check `$ANDROID_HOME/emulator/emulator -list-avds` there before finalizing.
      AVD_NAME: Pixel_6a
      MAESTRO_VERSION: '2.8.0'
      # INCIDENT (2026-09-28, job 108955336057 and its re-run 36433600188): this workflow's
      # first two real CI attempts both failed at "Disable animations" with adb `error: closed`.
      # Root-caused via local repro on this same runner machine, NOT an AVD boot-timing race:
      # BlueStacks (an unrelated third-party Android emulator, already running on this shared
      # persistent Mac for an unrelated reason) was squatting on port 5555 — the Android SDK
      # emulator's default first-instance ADB bridge port. Our own AVD's console (port 5554)
      # bound fine and it genuinely booted internally ("Boot completed in 20816 ms" in its own
      # log), but its ADB bridge collided with BlueStacks' already-there connection, so
      # `adb devices -l` only ever showed BlueStacks' phantom device, and every unqualified
      # `adb`/`adb -e` command — including the emulator's own internal post-boot calls — got
      # routed to BlueStacks' fluctuating connection instead of our AVD. No amount of settle
      # delay or retry-without-explicit-targeting could ever have fixed this.
      #
      # Fix: an explicit, deliberately-unusual port (outside the default 5554-5584 range other
      # emulator software would try first) claimed by our own AVD and referenced by serial in
      # EVERY adb/maestro call below — never relying on default single-device resolution again,
      # so this workflow stays correct even if BlueStacks (or anything else) starts using the
      # default port again on this shared machine in the future.
      EMULATOR_PORT: '5580'
      SERIAL: emulator-5580
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No setup-java/setup-gradle action, and no ~/.gradle caching: this is a persistent
      # self-hosted runner, so the Gradle wrapper's own dependency cache already survives between
      # runs on disk — adding actions/setup-java's or gradle/actions/setup-gradle's own caching on
      # top would just double-cache the same thing for no benefit, same lesson already learned
      # about the SPM cache on the iOS side of this runner (see ios-tests below). JDK 17 is
      # assumed already present on the runner per this repo's build requirements (`CLAUDE.md`) —
      # not independently confirmed for this specific runner image.
      - name: Build Android app (dev debug)
        run: ./gradlew :androidApp:assembleDevDebug --no-daemon

      # Added directly in response to the 2026-09-28 BlueStacks incident (see the env: block
      # comment above): logs what's already connected/listening BEFORE we touch anything, and
      # fails loudly and immediately if our own dedicated port is already occupied by something
      # foreign, rather than silently launching into a collision and producing the same
      # hours-to-diagnose "error: closed" symptom again. This is diagnostic-first, not just a
      # gate: `adb devices -l`'s output lands in the CI log regardless of outcome, so a future
      # collision (same port or a different one) is immediately visible here instead of requiring
      # another local-repro investigation like this incident needed.
      - name: Pre-flight device/port check
        run: |
          echo "Currently connected adb devices (before this job touches anything):"
          "$ANDROID_HOME/platform-tools/adb" devices -l
          if lsof -i :"$EMULATOR_PORT" >/dev/null 2>&1; then
            echo "::error::Port $EMULATOR_PORT is already in use by another process — refusing to launch our emulator into a collision. Run 'lsof -i :$EMULATOR_PORT' on the runner to identify it (this is exactly how the 2026-09-28 BlueStacks incident was found)."
            lsof -i :"$EMULATOR_PORT" || true
            exit 1
          fi
          echo "Port $EMULATOR_PORT is free — safe to proceed."

      # Mirrors the iOS job's "Erase and boot simulator" step: this is a persistent runner, not a
      # fresh VM per run, so a leftover emulator from a prior run (or a prior run's app data) is a
      # real possibility, not a theoretical one — wipe first rather than assume a clean slate.
      # `-port $EMULATOR_PORT` and `-s "$SERIAL" emu kill` (not bare `-e`) are both part of the
      # 2026-09-28 fix — see the env: block comment above.
      - name: Wipe emulator data
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s "$SERIAL" emu kill || true
          sleep 2
          "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -port "$EMULATOR_PORT" -wipe-data -no-window -no-audio -no-boot-anim &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"

      # Android equivalent of the iOS job's confirmed `bootstatus -b` + settle-delay lesson
      # (see its comment below in ios-tests) — `sys.boot_completed` becoming `1` is the Android
      # analogue of `bootstatus -b` returning, and carries the same caveat: it signals the boot
      # sequence completed, not that every system service (package manager, input dispatch) is
      # necessarily ready to accept commands yet.
      #
      # CONFIRMED as a real Android race, not just a theoretical iOS-derived precaution: this
      # workflow's first real CI run (job 108955336057, 2026-09-28) failed at the very next step
      # ("Disable animations") with `error: closed` on the first `adb shell` call — the ADB
      # transport itself had dropped moments after `sys.boot_completed` read 1. The settle sleep
      # below was already 10s (the iOS-derived starting value) and was NOT sufficient on its own;
      # bumped to 15s here as a modest additional buffer, but see "Disable animations" below for
      # the fix actually expected to close the gap — a fixed sleep can't deterministically fix a
      # transport-level drop, only reduce how often it's hit.
      - name: Wait for emulator boot
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s "$SERIAL" wait-for-device
          BOOT_COMPLETED=""
          for i in $(seq 1 60); do
            BOOT_COMPLETED=$("$ANDROID_HOME/platform-tools/adb" -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT_COMPLETED" = "1" ]; then
              echo "Boot completed after ${i} checks."
              break
            fi
            sleep 5
          done
          if [ "$BOOT_COMPLETED" != "1" ]; then
            echo "::error::Emulator did not report sys.boot_completed=1 within the poll window."
            exit 1
          fi
          sleep 15

      # Retries each command rather than relying on the settle delay above alone: the confirmed
      # failure here (`error: closed`) is a different class of problem than the iOS
      # SpringBoard-readiness race that motivated that delay — it's the ADB transport itself
      # dropping/re-negotiating shortly after boot, not a system service being slow to accept
      # commands. A longer sleep reduces how often the window is hit but can't guarantee it;
      # retrying the actual command after a `wait-for-device` re-sync is what directly handles a
      # transport that closed and needs to be re-established.
      - name: Disable animations
        run: |
          adb_shell_retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$ANDROID_HOME/platform-tools/adb" -s "$SERIAL" shell "$@"; then
                return 0
              fi
              echo "adb -s $SERIAL shell $* failed (attempt $attempt/3) — re-syncing and retrying..."
              "$ANDROID_HOME/platform-tools/adb" -s "$SERIAL" wait-for-device
              sleep 3
            done
            echo "::error::adb -s $SERIAL shell $* failed after 3 attempts."
            return 1
          }
          adb_shell_retry settings put global window_animation_scale 0
          adb_shell_retry settings put global transition_animation_scale 0
          adb_shell_retry settings put global animator_duration_scale 0

      # Stops Play Store (com.android.vending) from auto-updating anything on this freshly wiped
      # `google_apis_playstore` image while a flow runs. When its background update of Google Play
      # services (com.google.android.gms) finishes, Android kills Chrome - even in the foreground
      # (`Process com.android.chrome ... has died: fg TOP`, signal 9, 0.15-0.5s after Finsky's
      # `state:INSTALLED` for gms) - and TC-01's FormEU form, which runs in Chrome, disappears
      # mid-flow, dropping the flow back into the app.
      #
      # Diagnostic chain, 2026-09-29: local run 11 and CI run 36554995193 both left Chrome during
      # the form, right around a `hideKeyboard` - which on Android is a BACK key press - so that
      # BACK was suspected first and the sub-flow was changed to close the keyboard by tapping a
      # section heading instead. The next fresh run (local run 12) failed the same way with no
      # BACK sent at all. Reading this CI run's own full device logcat - still on disk because
      # this Mac is both the dev machine and the self-hosted runner, while the uploaded artifact
      # left logcat out - showed Chrome being killed by the Play services update, not navigated
      # away from, in all three failures (update landing 34-53s after the Chrome hand-off, while
      # the ~60s form was being filled), and no such update in any passing run. Play Store had
      # started self-updating and then updating Play services on every fresh wipe from about
      # midday that day, so this stopped being rare.
      #
      # `pm disable-user` works here without root (confirmed live: shell uid 2000, `user` build,
      # "new state: disabled-user"). This app does not need Play Store at runtime - it uses no
      # Play Integrity (see IosOpenID4VciBackend.kt's note). The check below fails the job if
      # the package is somehow still enabled, rather than letting the flow race the update again.
      - name: Disable Play Store auto-updates
        run: |
          adb_shell_retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$ANDROID_HOME/platform-tools/adb" -s "$SERIAL" shell "$@"; then
                return 0
              fi
              echo "adb -s $SERIAL shell $* failed (attempt $attempt/3) — re-syncing and retrying..."
              "$ANDROID_HOME/platform-tools/adb" -s "$SERIAL" wait-for-device
              sleep 3
            done
            echo "::error::adb -s $SERIAL shell $* failed after 3 attempts."
            return 1
          }
          adb_shell_retry pm disable-user --user 0 com.android.vending
          if ! "$ANDROID_HOME/platform-tools/adb" -s "$SERIAL" shell pm list packages -d | tr -d '\r' | grep -qx 'package:com.android.vending'; then
            echo "::error::com.android.vending is still enabled - Play services updates could kill Chrome mid-flow."
            exit 1
          fi

      # Checks the binary's own full path directly, not `command -v maestro`: $GITHUB_PATH
      # additions are job-scoped in GitHub Actions and do NOT carry over between jobs, even on
      # this same persistent self-hosted Mac — only the underlying ~/.maestro/bin/maestro file
      # itself persists on disk across jobs/runs. A fresh job's shell has no reason to already
      # resolve `maestro` via PATH before this step's own GITHUB_PATH line runs, so `command -v`
      # would false-negative every time and reinstall regardless — checking the real path is what
      # actually makes the skip work. Pinned to 2.8.0, matching the version already verified
      # locally this session (`maestro --version` → 2.8.0) and the version ios-tests below pins
      # to, for consistency across both jobs.
      - name: Install Maestro CLI
        run: |
          MAESTRO_BIN="$HOME/.maestro/bin/maestro"
          if [ -x "$MAESTRO_BIN" ] && "$MAESTRO_BIN" --version 2>/dev/null | grep -q "$MAESTRO_VERSION"; then
            echo "Maestro $MAESTRO_VERSION already installed at $MAESTRO_BIN on this persistent runner — skipping reinstall."
          else
            echo "Maestro $MAESTRO_VERSION not found (or a different version is present) at $MAESTRO_BIN — installing."
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Verify Maestro
        run: maestro --version

      # Explicit launch after install, mirroring the ios-tests job's own `xcrun simctl launch`
      # below — confirmed necessary interactively this session (2026-09-28): on a truly fresh
      # install, Maestro's `appId:` declaration in the flow file alone does not reliably
      # auto-launch the app first. Without this, the flow's first `tapOn: pin_text_field_0`
      # times out against the home screen (app installed, never launched), not a real app bug.
      - name: Install app
        run: |
          APK_PATH="androidApp/build/outputs/apk/dev/debug/androidApp-dev-debug.apk"
          "$ANDROID_HOME/platform-tools/adb" -s "$SERIAL" install -r "$APK_PATH"
          "$ANDROID_HOME/platform-tools/adb" -s "$SERIAL" shell am start -n eu.compote.euidi.dev/eu.europa.ec.assemblylogic.ui.MainActivity
          sleep 3

      # Marks "now" so the artifact-staging step below can find exactly the ~/.maestro/tests
      # folders this job's own flow run creates, via `find -newer`, rather than uploading every
      # folder ever accumulated on this persistent runner — same pattern as ios-tests below.
      - name: Mark start of this job's Maestro test runs
        run: touch /tmp/maestro_marker_android

      # Short per-step timeout inside the longer job-level one: a hung Maestro driver should fail
      # loudly and fast, not quietly eat the whole job budget — same reasoning as ios-tests below.
      # Scoped to ONLY the common flow file — see this file's header for why the Android
      # continuation file is deliberately NOT included here yet.
      - name: Run Maestro flow (TC-01 common — PIN setup through document catalog)
        timeout-minutes: 10
        run: maestro --device "$SERIAL" test .maestro/kmp/issuance/tc-01-pid-issuance-android.yaml

      # TC-22/24/25 wired in mechanically, NOT yet live-verified against this app (each file's own
      # header still says so) — added at the user's explicit request without device verification;
      # appId has been corrected to this app's real eu.compote.euidi.dev (was the iOS sibling
      # project's eu.europa.ec.euidi.dev), but everything else in these three files is still an
      # unconfirmed reference port. All three run on the SAME $SERIAL as TC-01 above, no erase or
      # reinstall in between — they depend on that same emulator session still holding TC-01's
      # issued PID; running any of them in isolation, without TC-01 having issued a PID first,
      # is expected to fail on a precondition these files assume, not a real bug.
      #
      # TC-22 (remote presentation via deep link, OpenID4VP): needs the PID TC-01 just issued
      # (it requests and shares the PID's family_name claim) — does not depend on any mDL
      # presence/absence. Fetches a fresh presentation request from the live verifier backend,
      # opens it as a deep link, shares via the consent screen, then confirms server-side that
      # the verifier actually received the data.
      - name: Run Maestro flow (TC-22 remote presentation)
        timeout-minutes: 10
        run: maestro --device "$SERIAL" test .maestro/presentation/tc-22-remote-presentation.yaml

      # TC-24 (user rejects a remote presentation request): reuses TC-22's own setup script
      # (same PID precondition, same verifier backend call) but taps Back instead of Share on
      # the consent screen, then confirms both a clean return to Documents and that the verifier
      # received nothing. Chained directly after TC-22 rather than run standalone so that any
      # one-time system permission prompt tied to opening this app's deep-link scheme (unconfirmed
      # whether Android's OS shows an equivalent to iOS's one-time "Open in EUDI Wallet?" dialog —
      # not yet observed live on this platform) is already resolved by the time this runs.
      - name: Run Maestro flow (TC-24 reject presentation)
        timeout-minutes: 10
        run: maestro --device "$SERIAL" test .maestro/presentation/tc-24-reject-presentation.yaml

      # TC-25 (RP requests a document the wallet doesn't have): fetches a fresh request for
      # Photo ID (org.iso.23220.photoid.1), a doctype this wallet holds zero of. PID being
      # present (from TC-01) is what makes this "wallet has other documents, just not this one,"
      # matching a real scenario rather than an empty-wallet edge case — the PID itself isn't
      # what's being requested here. Per the file's own header, this is architecturally distinct
      # from TC-24's consent-screen-with-reject path, not a variant of it: the app is expected to
      # show a separate pre-consent error screen and never reach the normal Share/consent UI at
      # all. Chained after TC-24 for the same shared-session/one-time-dialog reasoning above.
      - name: Run Maestro flow (TC-25 unsatisfiable request)
        timeout-minutes: 10
        run: maestro --device "$SERIAL" test .maestro/presentation/tc-25-unsatisfiable-request.yaml

      - name: Kill emulator
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s "$SERIAL" emu kill || true

      # The full `device-logcat.txt` is excluded: it's 85-92% of total folder size (measured
      # 2026-09-28), and - more importantly, this repo being public - the dev build logs complete
      # HTTP headers and bodies into it (access/refresh tokens, DPoP proofs, client attestations,
      # PID claims), so it must never be uploaded as-is. Screenshots and hierarchy dumps
      # (Maestro's own failure-point captures) are always kept.
      #
      # A filtered `device-logcat-filtered.txt` is staged next to it instead: an ALLOWLIST of the
      # line types that actually diagnosed this job's failures on 2026-09-29 - activity starts
      # (Chrome hand-off / first-run / return to app), keyboard show/hide (ImeTracker), injected
      # key presses (Maestro's hideKeyboard is a BACK key), the app's HTTP request URLs and
      # response status lines (not their headers/bodies), issuer error_description lines, and
      # crashes. Checked against three local runs' full logcats: no tokens, attestations,
      # authorization codes (Android already truncates intent URIs to `/...`) or PID claims
      # survive it; ~24 KB per run. Extend the allowlist only with line types known to be free
      # of credential/PII content - never switch it to a denylist.
      - name: Prepare Maestro artifacts for upload
        if: failure()
        run: |
          STAGING="maestro-artifacts-staging"
          LOGCAT_ALLOW='ActivityTaskManager.*(START u0|Displayed )|ImeTracker|adbd.*keyevent|WindowManager.*(Changing focus|focus changed)|EUDI Wallet[^:]*: (REQUEST|RESPONSE): |"error_description"|AndroidRuntime|FATAL EXCEPTION'
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          NEW_DIRS=$(find "$HOME/.maestro/tests" -maxdepth 1 -mindepth 1 -type d -newer /tmp/maestro_marker_android)
          if [ -z "$NEW_DIRS" ]; then
            echo "No new Maestro test-run folders found since this job started — nothing to stage."
          else
            for d in $NEW_DIRS; do
              rsync -a --exclude='device-logcat.txt' "$d" "$STAGING/"
              find "$d" -name device-logcat.txt | while read -r LOG; do
                OUT="$STAGING/$(basename "$d")/${LOG#"$d"/}"
                OUT="${OUT%device-logcat.txt}device-logcat-filtered.txt"
                mkdir -p "$(dirname "$OUT")"
                grep -E "$LOGCAT_ALLOW" "$LOG" > "$OUT" || true
              done
            done
          fi
          # Mask verifier transaction_ids in every staged text log/JSON (defense in depth - the
          # tc-22/25/26 setup scripts already log only its length). GET
          # /ui/presentations/{transaction_id} on the dev verifier returns the shared vp_token
          # with no auth, and these artifacts are public; confirmed 2026-09-30 that Maestro wrote
          # the id twice into maestro.log (its logMessages echo and the JsConsole line). Fails
          # this step - and so skips the upload - if an unmasked id is still present.
          find "$STAGING" -type f \( -name '*.log' -o -name '*.json' -o -name '*.txt' \) -exec sed -i '' -E \
            -e 's/(transaction_id=)[A-Za-z0-9_-]+/\1<redacted>/g' \
            -e 's/("transaction_id"[[:space:]]*:[[:space:]]*")[^"]+/\1<redacted>/g' {} +
          if grep -rqE 'transaction_id=[A-Za-z0-9_-]{8,}|"transaction_id"[[:space:]]*:[[:space:]]*"[^<"]' "$STAGING"; then
            echo "::error::Unmasked transaction_id still present in staged artifacts - not uploading."
            exit 1
          fi
          echo "Staged artifact contents:"
          find "$STAGING" -type f | sort

      - name: Upload Maestro debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-artifacts-android
          path: maestro-artifacts-staging
          retention-days: 3

  ios-tests:
    name: iOS — Maestro (TC-01 common flow)
    needs: android-tests
    # Critical: must run even if android-tests failed, so a platform-specific Android failure
    # doesn't mask whether the shared flow file is still fine on iOS (or vice versa) — this is
    # the whole reason these are two jobs instead of one, not just organizational tidiness.
    if: always()
    runs-on: [self-hosted, macOS, maestro]
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      # Confirmed correct THIS session, by an actual local xcodebuild run that produced
      # "BUILD SUCCEEDED" — not carried over from the old file's guesses.
      SCHEME: EudiWallet
      CONFIGURATION: Debug
      # Confirmed real, not a placeholder: `xcrun simctl list devices booted` showed exactly this
      # device — "iPhone 16 Pro" (UDID DB1FC896-B132-4F26-9F53-F4361270CDC1, iOS 18.0) — actively
      # booted and used for today's live TC-01 re-verification on this machine. CLAUDE.md's own
      # documented example command uses "iPhone 17" instead, but that's not what was actually
      # available/used here today — using the device genuinely exercised this session. Still not
      # independently confirmed present on the actual CI runner's image — check
      # `xcrun simctl list devices available` there before finalizing.
      SIMULATOR_NAME: iPhone 16 Pro
      MAESTRO_VERSION: '2.8.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Per CLAUDE.md's explicit guardrail: never hand-edit or assume iosApp/iosApp.xcodeproj is
      # already present — it's git-ignored and regenerated from iosApp/project.yml plus
      # app.properties/version.properties. The file this workflow replaces skipped this entirely
      # and assumed a committed EudiReferenceWallet.xcodeproj, which is a different project's
      # layout, not this repo's.
      - name: Generate iOS project
        run: ./gradlew generateIosProject --no-daemon

      - name: Find simulator UDID
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep "$SIMULATOR_NAME" \
            | tail -1 \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "::error::No '$SIMULATOR_NAME' simulator found on this runner image."
            exit 1
          fi
          echo "Found UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Resolve package dependencies
        run: |
          cd iosApp
          xcodebuild -resolvePackageDependencies \
            -project iosApp.xcodeproj \
            -scheme "$SCHEME"

      # No SPM/DerivedData caching: same persistent-runner lesson as Gradle above — this Mac
      # already keeps its SPM cache and DerivedData between runs on disk, so an actions-level
      # cache would just duplicate what's already there for no benefit.
      - name: Build for simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          cd iosApp
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath ../DerivedData \
            2>&1 | tee xcodebuild-maestro-build.log

      # Same settle-delay pattern already proven necessary on the sibling iOS project's own
      # runner (see that project's incident: "Suppress QuickPath keyboard tip" failed with
      # CoreSimulator error code=124, "Domain is tearing down", when this delay was missing) —
      # reused here defensively since this is the same class of runner/simulator readiness race,
      # even though it hasn't independently recurred against this specific repo yet.
      - name: Erase and boot simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          sleep 20

      # Not confirmed applicable to this app — kept from the sibling project's own confirmed
      # finding (QuickPath keyboard tip overlapping and shifting layout during point-based taps)
      # as defense in depth, since it costs nothing and this workflow's own flow uses inputText,
      # not point-based taps, for its only text entry (the PIN). Safe to drop later if this app
      # is confirmed never to hit it.
      - name: Suppress QuickPath keyboard tip
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard CPDidDiscover -bool true
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true

      - name: Install app
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          APP_PATH="../DerivedData/Build/Products/${CONFIGURATION}-iphonesimulator/EudiWallet.app"
          cd iosApp
          xcrun simctl install "$UDID" "$APP_PATH"
          # Correct bundle id for THIS repo, confirmed live this session (fresh install + PIN
          # setup + issuance all worked against it): eu.compote.euidi.dev — NOT the iOS sibling
          # project's eu.europa.ec.euidi.dev, which the old copied workflow had hardcoded.
          xcrun simctl launch "$UDID" eu.compote.euidi.dev
          sleep 3

      - name: Install Maestro CLI
        run: |
          MAESTRO_BIN="$HOME/.maestro/bin/maestro"
          if [ -x "$MAESTRO_BIN" ] && "$MAESTRO_BIN" --version 2>/dev/null | grep -q "$MAESTRO_VERSION"; then
            echo "Maestro $MAESTRO_VERSION already installed at $MAESTRO_BIN on this persistent runner — skipping reinstall."
          else
            echo "Maestro $MAESTRO_VERSION not found (or a different version is present) at $MAESTRO_BIN — installing."
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Verify Maestro
        run: maestro --version

      - name: Mark start of this job's Maestro test runs
        run: touch /tmp/maestro_marker_ios

      - name: Run Maestro flow (TC-01 common — PIN setup through document catalog)
        timeout-minutes: 10
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          maestro --udid "$UDID" test .maestro/kmp/issuance/tc-01-pid-issuance-common.yaml

      # TC-22/24/25 wired in mechanically, NOT yet live-verified against this app (each file's own
      # header still says so) — added at the user's explicit request without device verification;
      # appId has been corrected to this app's real eu.compote.euidi.dev (was the iOS sibling
      # project's eu.europa.ec.euidi.dev), but everything else in these three files is still an
      # unconfirmed reference port. All three run on the SAME booted simulator ($UDID) as TC-01
      # above, no erase or reinstall in between — they depend on that same simulator session still
      # holding TC-01's issued PID; running any of them in isolation, without TC-01 having issued a
      # PID first, is expected to fail on a precondition these files assume, not a real bug.
      #
      # TC-22 (remote presentation via deep link, OpenID4VP): needs the PID TC-01 just issued
      # (it requests and shares the PID's family_name claim) — does not depend on any mDL
      # presence/absence. Fetches a fresh presentation request from the live verifier backend,
      # opens it as a deep link, shares via the consent screen, then confirms server-side that
      # the verifier actually received the data.
      - name: Run Maestro flow (TC-22 remote presentation)
        timeout-minutes: 10
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          maestro --udid "$UDID" test .maestro/presentation/tc-22-remote-presentation.yaml

      # TC-24 (user rejects a remote presentation request): reuses TC-22's own setup script
      # (same PID precondition, same verifier backend call) but taps Back instead of Share on
      # the consent screen, then confirms both a clean return to Documents and that the verifier
      # received nothing. Chained directly after TC-22 rather than run standalone so that a
      # one-time "Open in EUDI Wallet?" system dialog the reference file's own comments describe
      # (asserted for the iOS sibling project, NOT independently confirmed against this app) is
      # already dismissed by the time this runs, same reasoning as the equivalent step in
      # android-tests.
      - name: Run Maestro flow (TC-24 reject presentation)
        timeout-minutes: 10
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          maestro --udid "$UDID" test .maestro/presentation/tc-24-reject-presentation.yaml

      # TC-25 (RP requests a document the wallet doesn't have): fetches a fresh request for
      # Photo ID (org.iso.23220.photoid.1), a doctype this wallet holds zero of. PID being
      # present (from TC-01) is what makes this "wallet has other documents, just not this one,"
      # matching a real scenario rather than an empty-wallet edge case — the PID itself isn't
      # what's being requested here. Per the file's own header, this is architecturally distinct
      # from TC-24's consent-screen-with-reject path, not a variant of it: the app is expected to
      # show a separate pre-consent error screen and never reach the normal Share/consent UI at
      # all. Chained after TC-24 for the same shared-session/one-time-dialog reasoning above.
      - name: Run Maestro flow (TC-25 unsatisfiable request)
        timeout-minutes: 10
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          maestro --udid "$UDID" test .maestro/presentation/tc-25-unsatisfiable-request.yaml

      - name: Prepare Maestro artifacts for upload
        if: failure()
        run: |
          STAGING="maestro-artifacts-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          NEW_DIRS=$(find "$HOME/.maestro/tests" -maxdepth 1 -mindepth 1 -type d -newer /tmp/maestro_marker_ios)
          if [ -z "$NEW_DIRS" ]; then
            echo "No new Maestro test-run folders found since this job started — nothing to stage."
          else
            for d in $NEW_DIRS; do
              rsync -a \
                --exclude='device-simulator.log' \
                --exclude='device-xctest.log' \
                --exclude='xctest_runner_*.log' \
                "$d" "$STAGING/"
            done
          fi
          # Mask verifier transaction_ids in every staged text log/JSON (defense in depth - the
          # tc-22/25/26 setup scripts already log only its length). GET
          # /ui/presentations/{transaction_id} on the dev verifier returns the shared vp_token
          # with no auth, and these artifacts are public; confirmed 2026-09-30 that Maestro wrote
          # the id twice into maestro.log (its logMessages echo and the JsConsole line). Fails
          # this step - and so skips the upload - if an unmasked id is still present.
          find "$STAGING" -type f \( -name '*.log' -o -name '*.json' -o -name '*.txt' \) -exec sed -i '' -E \
            -e 's/(transaction_id=)[A-Za-z0-9_-]+/\1<redacted>/g' \
            -e 's/("transaction_id"[[:space:]]*:[[:space:]]*")[^"]+/\1<redacted>/g' {} +
          if grep -rqE 'transaction_id=[A-Za-z0-9_-]{8,}|"transaction_id"[[:space:]]*:[[:space:]]*"[^<"]' "$STAGING"; then
            echo "::error::Unmasked transaction_id still present in staged artifacts - not uploading."
            exit 1
          fi
          echo "Staged artifact contents:"
          find "$STAGING" -type f | sort

      - name: Upload Maestro debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-artifacts-ios
          path: maestro-artifacts-staging
          retention-days: 3
