# M5b: open ${LINK} (system dialog, unlock gate if shown) and wait for state ${STATE}.
appId: eu.compote.euidi.dev
---
- openLink: ${LINK}
- tapOn:
    text: "Open"
    optional: true
- runFlow:
    when:
      visible:
        id: "pin_text_field_0"
    commands:
      - tapOn:
          id: "pin_text_field_0"
      - inputText: "123456"
- extendedWaitUntil:
    visible:
      id: "ux-state-${STATE}"
    timeout: 30000
