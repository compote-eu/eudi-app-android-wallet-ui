# M5b: press the node ${NODE} (its bundle node id is its test tag, on interpreted and hand-written screens alike)
# and wait for state ${STATE} (FlowHost tags the drawn state ux-state-<id>).
appId: eu.compote.euidi.dev
---
- tapOn:
    id: "${NODE}"
- extendedWaitUntil:
    visible:
      id: "ux-state-${STATE}"
    timeout: 30000
