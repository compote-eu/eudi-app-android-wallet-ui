# M5: after `simctl openurl openid4vp://...` with `--ux-spike gallery-<page>`, confirm the system dialog, pass the
# unlock gate if it shows, and wait for the gallery's page picker (debug-only template gallery).
appId: eu.compote.euidi.dev
---
- tapOn:
    text: "Open"
    optional: true
- runFlow:
    when:
      visible:
        id: "pin_text_field_0"
    commands:
      - tapOn:
          id: "pin_text_field_0"
      - inputText: "123456"
- extendedWaitUntil:
    visible:
      id: "gallery-pick-sheet"
    timeout: 20000
