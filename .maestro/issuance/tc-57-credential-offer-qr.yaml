# ⚠️ PORTED FROM eudi-app-ios-wallet-ui, UNVERIFIED against this KMP app -- accessibility IDs,
# navigation, and screen structure likely differ (confirmed divergent in TC-01's initial port
# attempt: 2026-09-09). Treat as a reference/starting point, not a working flow.
#

appId: eu.europa.ec.euidi.dev
---
# TC-57 — issuance via a scanned/deep-linked OpenID4VCI Credential Offer
# ("Scan QR" icon on the Add Document screen), as distinct from every
# other issuance flow in this suite, which all use the app's own
# pre-configured "Choose from list" issuer path.
#
# Precondition: app already unlocked (PIN done in a prior TC-01 run in
#   the same simulator session) - same convention as TC-51. This flow
#   does NOT re-do PIN setup, and does not stand alone.
#
# Confirmed via code (AddDocumentViewModel.onScanClick() ->
# ScannerViewModel -> AppRoute.credentialOfferRequest, and separately
# DeepLinkController's `.credential_offer` case for any incoming
# `openid-credential-offer://`/`haip-vci://` URL - both schemes are
# registered in Wallet.plist and route to the exact same
# DocumentOfferViewModel destination) that the "Scan QR" icon's camera
# is purely a way to obtain a URL string - a real scan and an
# OS-level/`openLink`-delivered URL of the same scheme both land on the
# identical screen. This flow exercises that shared code path directly
# via `openLink`, bypassing the camera-scanning UI screen itself (which
# would need real-camera/Appium work to test, out of scope here - see
# .maestro/issuance/README.md's TC-57 section for the full writeup).
#
# tc-57-fetch-credential-offer.js replicates the DEV issuer's own web
# frontend request sequence to get a fresh, real credential-offer URI -
# see that script's own header for the full three-request shape. A
# hardcoded URI wouldn't work on a later run: the offer's `issuer_state`
# is single-use, same reasoning as tc-22-setup-presentation.js's fresh
# request per run.
- runScript: tc-57-fetch-credential-offer.js

# `openLink`, not `xcrun simctl openurl`: confirmed live that Maestro's
# openLink works directly with this non-http(s) custom scheme (no shell
# wrapper needed, unlike TC-32/TC-46/TC-47's process/exec-requiring
# scripts).
- openLink: "${output.offerUri}"

# The OS-level "Open in 'EUDI Wallet'?" confirmation dialog appeared on
# some runs of this flow but not others (confirmed live: absent in an
# initial manual probe with a hardcoded literal URI, present on this
# flow's own first committed run with the exact same openLink mechanism
# just fetched via output.offerUri instead) - apparently timing/state-
# dependent rather than deterministic, not something to assume away in
# either direction. Handled the same optional way as the "Allow"
# identity-verification dialog below in formeu-identity-proofing-flow.yaml.
- extendedWaitUntil:
    visible:
      text: "Open"
    timeout: 5000
    optional: true
- tapOn:
    text: "Open"
    optional: true

# --- "Issuance request" confirmation screen ---
# This screen does NOT appear anywhere in TC-01/TC-50's own "Choose from
# list" path - it's specific to the credential-offer entry point
# (DocumentOfferViewModel). Confirmed via a live hierarchy dump.
- tapOn:
    id: "document_offer_screen_issue_button"

# --- ASWebAuthenticationSession consent -> FormEU identity-proofing form ->
#     Review & Send -> Authorize -> success screen -> Done ---
# Converges exactly with TC-01 from this point on - see
# formeu-identity-proofing-flow.yaml's own header for why this is a
# shared sub-flow rather than a second copy of TC-01's steps.
- runFlow: formeu-identity-proofing-flow.yaml

# --- Verify: exactly the requested credential (PID MSO Mdoc only) is
#     issued and visible, NOT the "PID Combined" pair TC-01 gets ---
# Explicitly navigate to Documents first, rather than assuming we're
# already there: confirmed live that "Done" returns to whichever tab
# was active before the deep link was triggered (here: Home, since
# `openLink` doesn't require any prior tab context) - same documented
# behavior as tc-26-multi-document.yaml's own fix for this.
- tapOn:
    id: "documents_tab"
- extendedWaitUntil:
    visible: "PID (MSO Mdoc)"
    timeout: 10000
- assertVisible: "Valid until \\d{2} \\w{3} \\d{4}"
