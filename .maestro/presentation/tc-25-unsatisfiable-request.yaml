# ⚠️ PORTED FROM eudi-app-ios-wallet-ui, UNVERIFIED against this KMP app -- accessibility IDs,
# navigation, and screen structure likely differ (confirmed divergent in TC-01's initial port
# attempt: 2026-09-09). Treat as a reference/starting point, not a working flow.
#
# IDs updated from static code analysis (testTag inventory + navigation mapping) — NOT YET
# LIVE-VERIFIED.

appId: eu.compote.euidi.dev
---
# TC-25 — RP requests an attribute/document the wallet doesn't have
#
# Precondition: app already unlocked, with TC-01 already run in the same
#   simulator session. Does NOT actually require the PID to satisfy
#   anything here (the whole point is the request can't be satisfied),
#   but PID being present is what makes this a genuine "wallet has other
#   documents, just not this one" case rather than an empty wallet -
#   matching a real-world scenario more closely. Runs chained after
#   TC-24 in CI, which is also what makes the "one-time per erase"
#   system dialog already granted (see below).
# Steps: fetch a fresh presentation request for a document type this
#   wallet holds zero of (Photo ID, org.iso.23220.photoid.1) -> open it
#   as a deep link -> confirm the consent screen shows its "no matching
#   document" state with Share disabled -> tap Cancel -> confirm a clean
#   return to Documents -> verify server-side that nothing was received.
# Expected: the "The requested document is not available in your EUDI
#   Wallet..." error on the consent screen, Share present but disabled,
#   clean return to Documents on Cancel, and no vp_token at the verifier.
#
# Notes:
#
# - In THIS app it is the same consent screen as TC-22/TC-24, not a
#   separate error screen (the iOS reference app this was ported from has
#   a distinct "Required credential_set cannot be satisfied" screen with
#   only a back button). Confirmed from a live hierarchy dump on Android,
#   2026-09-30: "Data sharing request" / "Verifier Signer dev" header, an
#   `Error` icon and the request_no_data text where the requested-data list
#   would be, `request_screen_primary_button` ("Share") with
#   enabled=false, and `request_screen_secondary_button` ("Cancel")
#   enabled. The error text has no testTag, hence the text match below.
#
# - Cancel is `request_screen_secondary_button`, not `back_button` (which
#   this app doesn't have) - same fix and same Event.OnBack decline as
#   TC-24; see tc-24-reject-presentation.yaml's notes.
#
# - Reuses the same setup-script structure as TC-22/TC-24
#   (tc-25-setup-photoid-request.js) - see that file for why the
#   photoid-cred DCQL query is a well-formed, backend-accepted request
#   (confirmed live: 200, not a validation error) for something this
#   wallet simply doesn't hold, not a malformed one.
#
# - The one-time "Open in EUDI Wallet?" system dialog (see TC-22's own
#   comments for the full one-time-per-erase story) is handled here
#   defensively with the same optional wait+tap, but is NOT expected to
#   actually appear when this flow runs chained after TC-22/TC-24 in the
#   same simulator session - already granted earlier in that session.
#   Kept optional for the same standalone-local-run reason as TC-24.
#
# - Verification (tc-25-verify-no-receipt.js) is intentionally the SAME
#   shape as TC-24's: the verifier can't tell a decline from an
#   unsatisfiable request, so the server-side check only ever proves
#   "nothing was received" (no vp_token), and the client-side assertions
#   above (the error text, Share disabled) are the only signal that
#   distinguishes this scenario from TC-24 at all.

# --- Setup: fetch a fresh presentation request for a document type this
#     wallet holds zero of ---
- runScript: tc-25-setup-photoid-request.js

# --- Trigger it via deep link ---
- openLink: "${output.presentationUrl}"

# --- One-time system dialog, not expected to appear when chained after
#     TC-22/TC-24 in the same session (see notes above) ---
- extendedWaitUntil:
    visible:
      text: "Open"
    timeout: 10000
    optional: true
- tapOn:
    text: "Open"
    optional: true

# --- Consent screen in its "no matching document" state: the inline
#     error text, Share present but disabled, then Cancel ---
# Full-string match (Maestro text selectors are full regexes) on the
# shared English string request_no_data (shared-ui strings.xml), which
# RequestScreen.kt renders in place of the requested-data list.
- assertVisible: "The requested document is not available in your EUDI Wallet. Please contact the authorised issuer for further information."
- assertVisible:
    id: "request_screen_primary_button"
    enabled: false
- tapOn:
    id: "request_screen_secondary_button"

# --- Verify: clean return to Documents, no error/stuck state ---
- assertVisible:
    id: "dashboard_screen_bottom_navigation_item_documents"

# --- Verify the verifier backend received nothing (see
#     tc-25-verify-no-receipt.js for why this check is the same shape as
#     TC-24's, and why that's expected rather than a shortcut) ---
- runScript: tc-25-verify-no-receipt.js
