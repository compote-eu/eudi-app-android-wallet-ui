# XcodeGen spec for the iOS wallet app. Regenerate the .xcodeproj with:
#   ./gradlew generateIosProject
# The project is generated (not committed); project.yml is the source of truth.
#
# ⚠️ Regenerate with that Gradle task, NOT with a bare `xcodegen generate`. Every `${...}` below is
# expanded by XcodeGen from the *environment* at generate time, and the task is what puts
# `version.properties` and `app.properties` there — the two files Android reads for the same values.
# A bare `xcodegen generate` leaves each one as the literal text `${VERSION_NAME}` with no warning
# (verified), so the app would ship that string as its version. `$(...)` is different: those are Xcode
# build settings, resolved at build time, and are meant to survive generation verbatim.
#
# The project name stays `iosApp` (so the generated project is `iosApp/iosApp.xcodeproj`) while the
# target is `EudiWallet` — the same split the reference wallet has, whose project is
# `EudiReferenceWallet.xcodeproj` and whose app target is `EudiWallet`.
name: iosApp
options:
  bundleIdPrefix: ${APP_ID}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Swift package dependencies. RQES (remote document signing) is the iOS mirror of Android's
# `eudi-lib-android-rqes` stack, shipped by the same org as a SwiftUI library with its own UI.
packages:
  EudiRQESUi:
    url: https://github.com/eu-digital-identity-wallet/eudi-lib-ios-rqes-ui.git
    exactVersion: 0.4.3
  # ⚠️ NOT a dependency we use — a *version override*, and it must stay declared even though no
  # Swift file imports `Copyable`.
  #
  # EudiRQESUi depends on eu-digital-identity-wallet/SwiftCopyableMacro `from: "0.0.5"`, whose
  # Package.swift bounds swift-syntax at `..<603.0.0`. Swift 6.3 ships swift-syntax 603.x, so on
  # Xcode 26.x that graph cannot resolve and the whole RQES stack is unbuildable.
  #
  # SwiftPM resolves packages by *identity* — the lowercased last path component of the URL — so
  # declaring our fork here (same identity, `swiftcopyablemacro`) supersedes the copy EudiRQESUi
  # pulls, without forking EudiRQESUi itself. Our fork changes exactly one line: the bound widened
  # to `..<604.0.0`. Verified: swift-syntax then resolves to 603.0.2 instead of 602.0.0.
  # SwiftPM warns "Conflicting identity for swiftcopyablemacro ... will be escalated to an error in
  # future versions of SwiftPM" — expected, and why the upstream PR matters.
  #
  # Upstream PR: eu-digital-identity-wallet/SwiftCopyableMacro#16, for issue #15. When it lands
  # *and is tagged* 0.0.6, delete this entry — EudiRQESUi's `from: "0.0.5"` picks it up on its own.
  # A merge alone is not enough; the tag is what it resolves against.
  #
  # ⚠️ Building this graph requires dropping `-sdk iphonesimulator` from the xcodebuild command.
  # `-sdk` overrides SDKROOT for EVERY target, including the macro *compiler plugin*, which must be
  # built for the host. With it, CopyablePlugin compiles as `arm64-apple-ios13.0-simulator` and dies
  # on `could not find module 'SwiftCompilerPlugin' ... found: arm64-apple-macos`. Use `-destination`
  # alone, which sets the platform for the app without forcing the SDK on host tools. Verified: with
  # `-sdk` removed the plugin builds `arm64-apple-macos10.15` and the app links RQES cleanly.
  # Reproduced with an unrelated macro package (pointfreeco/swift-case-paths), so this is about the
  # flag, not this package. `-skipMacroValidation` does NOT work around it — it makes Xcode skip the
  # macro machinery and mis-target the plugin the same way; the macro is trusted once in Xcode
  # instead (cached in ~/Library/org.swift.swiftpm/security/macros.json).
  SwiftCopyableMacro:
    url: https://github.com/mc1100/SwiftCopyableMacro.git
    branch: widen-swift-syntax-bound-to-603

targets:
  # `PRODUCT_NAME` defaults to the target name, which is what `CFBundleName` and the built `.app` are
  # called — so this is `EudiWallet`, as in the reference wallet. The *user-visible* name is
  # `CFBundleDisplayName` below; the two differ on purpose, exactly as they do there.
  # ⚠️ This is also the scheme name: build with `-scheme EudiWallet`.
  EudiWallet:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    # Generated by XcodeGen (and git-ignored, like the .xcodeproj) — project.yml stays the source of
    # truth. Regenerate with `./gradlew generateIosProject`.
    info:
      path: iosApp/Info.plist
      properties:
        # Compose Multiplatform throws at launch without this:
        #   IllegalStateException: `Info.plist` doesn't have a valid
        #   `CADisableMinimumFrameDurationOnPhone` entry
        # It refuses to start rather than silently cap rendering at 60Hz on high-refresh iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # Empty dict = the default system launch screen, replacing
        # INFOPLIST_KEY_UILaunchScreen_Generation now that the plist is explicit.
        UILaunchScreen: {}
        # The user-visible app name — what Springboard shows under the icon. Without this key iOS falls
        # back to CFBundleName (`$(PRODUCT_NAME)`, i.e. the target name), which is how this app came to
        # be called "iosApp". The value comes from `app.properties` via APP_DISPLAY_NAME below, the
        # same file Android's `android:label` is built from.
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        # The version pair, from `version.properties` — the file Android reads for versionName and
        # versionCode. `$(...)` rather than a literal so the value has exactly one home; see
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION below.
        #
        # CFBundleShortVersionString is what the settings screen shows: `IosSettingsPlatformBridge`
        # reads it, as the official iOS wallet's `ConfigLogicImpl.appVersion` reads the same key.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The OpenID4VCI authorization redirect. The authorization server will only redirect to the
        # URI registered for our client_id — `eu.europa.ec.euidi://authorization`, the same value
        # Android builds as ISSUE_AUTHORIZATION_DEEPLINK — so iOS has to claim that scheme or the
        # browser has nowhere to send the result. See `IosAuthorizationRedirects`.
        #
        # From `app.properties`, which Android's convention plugin reads for the same string.
        # ⚠️ It equals APP_ID today but is deliberately NOT `$(PRODUCT_BUNDLE_IDENTIFIER)`-derived:
        # the dev flavour's bundle id carries `.dev` and this must not, or the AS has nowhere to send
        # the result on the one flavour everything is tested on.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).authorization
            CFBundleURLSchemes:
              - ${OID4VCI_REDIRECT_SCHEME}
          # Credential offers, the same two schemes Android registers (CREDENTIAL_OFFER_SCHEME and
          # CREDENTIAL_OFFER_HAIP_SCHEME). Without these iOS never hands the link to the app at all.
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).credentialOffer
            CFBundleURLSchemes:
              - openid-credential-offer
              - haip-vci
          # The RQES authorization result. The QTSP redirects here when the user has authorized the
          # signature, and `WalletDocumentSigner.resume` continues the flow the SDK already started.
          # Same value Android builds as BuildConfig.RQES_DEEPLINK (`rqes://oauth/callback`), so both
          # platforms register the identical redirect with the signing service.
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).rqes
            CFBundleURLSchemes:
              - rqes
          # Remote presentation (OpenID4VP), the same four schemes Android registers. All four,
          # because the wallet does not choose: the *verifier* builds the link, and the EUDI dev
          # verifier emits `haip-vp://` by default while its OpenID4VP profile emits `openid4vp://`.
          # See `IosDeepLinks.PRESENTATION_SCHEMES`, which must list exactly these.
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).presentation
            CFBundleURLSchemes:
              - openid4vp
              - eudi-openid4vp
              - mdoc-openid4vp
              - haip-vp
          # ── Android registers two schemes this app deliberately does not ──────────────────────
          # Checked by `DeepLinkSchemeParityTest` (a JVM test in :ui-logic), which reads Android's
          # schemes from the generated BuildConfig and iOS's from *this file*, so neither list is
          # restated anywhere. Do not add either without also
          # giving the link somewhere to land — registering a scheme the app cannot act on is
          # worse than not registering it, because the link then opens the wallet onto a dead end.
          #
          #   eudi-rqes  RP-initiated document retrieval. Android routes it to
          #              `EudiRQESUi.initiate(context, remoteUri = ...)`, verifying the RP's request
          #              against the `pidissuerca02_*` CAs in `RQESConfigImpl.documentRetrievalConfig`.
          #              The iOS `EudiRQESUi` package exposes only `initiate(on:fileUrl:)` — a *local*
          #              file — and `resume(on:authorizationCode:)`. No remote-URI entry point exists,
          #              so there is nothing to hand the link to. Upstream rqes-ui#109; the official
          #              iOS wallet has the same limitation.
          #   eudi-wallet  The wallet's own scheme (`BuildConfig.DEEPLINK`). Dead on Android too: no
          #              code produces or consumes such a link, `DeepLinkType` does not list it, and an
          #              inbound one falls through to EXTERNAL -> `openUrl`, re-opening its own scheme.
          #              Unfinished upstream scaffolding, so it is mirrored as absent rather than as a
          #              second dead registration.
        # The QR scanner's camera. Like the Bluetooth string below, this *is* the permission: iOS
        # shows it in the prompt the first time AVFoundation is asked for the camera, and an app
        # without the key is terminated instead of prompted.
        NSCameraUsageDescription: >-
          Scan a QR code to share a document or to add one to your wallet.
        # Biometric unlock. Like the two strings below this *is* the permission surface: iOS shows it
        # in the Face ID prompt `IosBiometricGate` raises, and an app without the key gets the generic
        # system wording. The official iOS wallet sets the same key
        # (INFOPLIST_KEY_NSFaceIDUsageDescription); Touch ID needs no equivalent.
        NSFaceIDUsageDescription: >-
          Unlock your wallet and authorise sharing a document.
        # ISO 18013-5 proximity sharing. iOS has no runtime Bluetooth permission to request; this
        # string *is* the permission — CoreBluetooth raises the system prompt with it the first time
        # the wallet advertises, and without the key the app is terminated instead of prompted.
        NSBluetoothAlwaysUsageDescription: >-
          Share documents from your wallet with a nearby reader over Bluetooth.
        # Background credential top-up — iOS's counterpart of Android's `ReIssuanceWorkManager`, which
        # `Application` enqueues through WorkManager every 15 minutes.
        #
        # Both keys are required and neither is optional: `BGTaskScheduler.register` raises
        # `NSInternalInconsistencyException` at launch for an identifier missing from the permitted
        # list, and without the `processing` background mode the task is never run at all. The
        # identifier is a fixed string rather than `$(PRODUCT_BUNDLE_IDENTIFIER)`-derived, so the dev
        # and demo builds ask for the same task by the same name — it identifies the work, not the app.
        BGTaskSchedulerPermittedIdentifiers:
          - eu.europa.ec.euidi.reissuance
        UIBackgroundModes:
          - processing
    # ── Digital Credentials API: the provider entitlement ────────────────────────────────────────
    #
    # Registering a document with iOS's credential picker needs this restricted entitlement, and the
    # array is the OS's filter: a doctype absent from it cannot be registered, and the attempt comes
    # back as `.notAuthorized` rather than as anything that names the cause. multipaz's own
    # registration path carries the same warning in its error branch ("did you add it to the
    # entitlement file?").
    #
    # ⚠️ **Inert under ad-hoc signing, which is how this fork builds today.** The entitlement is
    # restricted: it is only honoured when it also appears in a real provisioning profile, so with
    # `CODE_SIGN_IDENTITY: "-"` the registry answers `notAuthorized` and nothing is registered.
    # Declaring it anyway is deliberate — it is what makes the build correct the moment the fork moves
    # onto team signing, and `DocumentRegistrationManagerImpl.status()` prints exactly which of the
    # two states we are in rather than leaving an empty picker unexplained.
    #
    # The doctypes are ours, not the reference wallet's list copied over: these are the three mdoc
    # types this tree can actually hold. Theirs also names `eu.europa.ec.av.1` and
    # `org.iso.23220.1.jp.mnc`, which nothing here issues, and spells photo ID `org.iso.23220.photoid.1`
    # where our documents use `org.iso.23220.2.photoid.1`. Registering a doctype we never hold would be
    # a claim with no document behind it.
    entitlements:
      path: iosApp/EudiWallet.entitlements
      properties:
        com.apple.developer.identity-document-services.document-provider.mobile-document-types:
          - eu.europa.ec.eudi.pid.1
          - org.iso.18013.5.1.mDL
          - org.iso.23220.2.photoid.1
    dependencies:
      - package: EudiRQESUi
        product: EudiRQESUi
    settings:
      base:
        # ── Identity and version, all from the two properties files Android reads ─────────────────
        #
        # `${...}` is XcodeGen expanding an environment variable at *generate* time; `$(...)` is Xcode
        # resolving a build setting at *build* time. Both appear here on purpose: the values come from
        # the properties files once, and the per-variant composition stays a build setting so
        # overriding BUILD_VARIANT alone moves the name and the id together.
        #
        # The reference wallet does none of this — it writes `PRODUCT_BUNDLE_IDENTIFIER`,
        # `INFOPLIST_KEY_CFBundleDisplayName` and `MARKETING_VERSION` out literally in all eight of
        # its build configurations, and its Android sibling repeats them in Gradle.
        #
        # The bundle id is the same identity that reference wallet uses: `eu.europa.ec.euidi` for demo
        # and `eu.europa.ec.euidi.dev` for dev, matching Android's `applicationIdSuffix`.
        # ⚠️ It is therefore the *same bundle id as the reference wallet*, so the two cannot be
        # installed side by side — whichever is installed second replaces the first, along with its
        # wallet data. Deliberate: this app is the KMP build of that wallet, not a companion to it.
        PRODUCT_BUNDLE_IDENTIFIER: "${APP_ID}$(BUNDLE_ID_SUFFIX_$(BUILD_VARIANT))"
        BUNDLE_ID_SUFFIX_dev: "${APP_ID_SUFFIX_dev}"
        BUNDLE_ID_SUFFIX_demo: "${APP_ID_SUFFIX_demo}"
        # The launcher name, reaching CFBundleDisplayName above. Both variants are named identically
        # today (the suffixes are empty in `app.properties`, as upstream and the reference wallet both
        # do); the mechanism is here so that changing one file changes both platforms.
        APP_NAME: "${APP_NAME}"
        APP_NAME_SUFFIX_dev: "${APP_NAME_SUFFIX_dev}"
        APP_NAME_SUFFIX_demo: "${APP_NAME_SUFFIX_demo}"
        APP_DISPLAY_NAME: "$(APP_NAME)$(APP_NAME_SUFFIX_$(BUILD_VARIANT))"
        # Android's versionName and versionCode, from version.properties. `yyyy.mm.v` is upstream's
        # committed CalVer placeholder, replaced at release time — see that file.
        MARKETING_VERSION: "${VERSION_NAME}"
        CURRENT_PROJECT_VERSION: "${VERSION_CODE}"
        # Which of Android's two product flavours this build mirrors, named as the reference iOS
        # wallet names it (`BUILD_VARIANT` in its `Wallet*.xcconfig`). Passed straight through to
        # Gradle as `-PappFlavor` by the pre-build script below, which is what selects
        # `shared-logic/src/iosDevMain` or `src/iosDemoMain`.
        #
        # `dev` by default, matching `assembleDevDebug` and every documented probe run. Build the
        # other flavour with:
        #   xcodebuild ... BUILD_VARIANT=demo
        # Xcode caches the framework per configuration, not per setting, so switch flavours with a
        # clean build (or `./gradlew clean`) — a stale SharedKit is the one way to get a dev framework
        # inside a demo app.
        BUILD_VARIANT: dev
        # NB: no GENERATE_INFOPLIST_FILE here. Compose Multiplatform requires
        # `CADisableMinimumFrameDurationOnPhone`, and Xcode's generated-plist mechanism only honours a
        # documented allowlist of INFOPLIST_KEY_* settings — an arbitrary one is silently dropped
        # (verified: the key never reached the built Info.plist). So the plist is generated from the
        # `info:` block below instead, which is also more XcodeGen-idiomatic.
        SWIFT_VERSION: "6.0"
        # Ad-hoc signing rather than none: an unsigned app has no entitlements at all, and the Keychain
        # then refuses every `SecItem` call with -34018 (errSecMissingEntitlement) — which is where the
        # wallet's PIN lives. "-" needs no development team, so this still builds on any machine.
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # The Kotlin framework is built by the pre-build script below into this folder.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared-ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - SharedKit
          # System SQLite, required by the shared document layer. multipaz stores documents and
          # credentials in SQLite through `androidx.sqlite`'s NativeSQLiteDriver, which reaches
          # libsqlite3 by **cinterop**: the klib records the `sqlite3_*` symbols but carries no
          # implementation, so the final link has to resolve them and only the consuming Xcode target
          # can. Without this the app fails to link with ~23 undefined `_sqlite3_*` symbols even
          # though `:shared-ui:linkDebugFrameworkIosSimulatorArm64` succeeds — another case of a green
          # Kotlin framework link not proving the Swift app builds.
          - -lsqlite3
    preBuildScripts:
      - name: Check identity is in step with the properties files
        basedOnDependencyAnalysis: false
        script: |
          # The identity and version build settings are baked into the Xcode project at *generate*
          # time from version.properties / app.properties (see the header). Xcode resolves build
          # settings before any script phase runs, so this phase cannot repair a stale project — it
          # can only refuse to ship one, which is why it fails rather than regenerating.
          #
          # It compares the values Xcode actually resolved, not file timestamps, so it also catches a
          # project generated by a bare `xcodegen generate`: the settings then hold the unexpanded
          # reference text itself, which matches nothing.
          #
          # NB: no `$`+`{NAME}` anywhere in this script, not even in a comment — XcodeGen expands that
          # form in the script body too, so writing one here would rewrite this comment at generate
          # time (it did). `${NAME:-default}` is safe; XcodeGen leaves the shell default form alone.
          if [ "$ACTION" = "indexbuild" ] || [ "$ENABLE_PREVIEWS" = "YES" ]; then
            exit 0
          fi
          prop() { sed -n "s/^$2=//p" "$SRCROOT/../$1" | head -1; }
          variant="${BUILD_VARIANT:-dev}"
          stale=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "error: $1 is '$2' but the properties files say '$3'." >&2
              stale=1
            fi
          }
          check MARKETING_VERSION "$MARKETING_VERSION" "$(prop version.properties VERSION_NAME)"
          check CURRENT_PROJECT_VERSION "$CURRENT_PROJECT_VERSION" \
            "$(prop version.properties VERSION_CODE)"
          check APP_DISPLAY_NAME "$APP_DISPLAY_NAME" \
            "$(prop app.properties APP_NAME)$(prop app.properties "APP_NAME_SUFFIX_$variant")"
          check PRODUCT_BUNDLE_IDENTIFIER "$PRODUCT_BUNDLE_IDENTIFIER" \
            "$(prop app.properties APP_ID)$(prop app.properties "APP_ID_SUFFIX_$variant")"
          if [ "$stale" -ne 0 ]; then
            echo "error: the Xcode project is out of step with version.properties / app.properties." >&2
            echo "note: regenerate it with './gradlew generateIosProject', then build again." >&2
            exit 1
          fi
      - name: Compile Kotlin Framework (SharedKit)
        basedOnDependencyAnalysis: false
        script: |
          # Build guard: skip the Gradle task during Xcode's index build AND SwiftUI previews,
          # so the Kotlin framework isn't rebuilt (or deadlocked) outside a real build. Android
          # Studio's KMP inspection ("Missing build guard for an Xcode target") flags a
          # framework-compile script phase that doesn't guard both of these actions.
          if [ "$ACTION" = "indexbuild" ] || [ "$ENABLE_PREVIEWS" = "YES" ]; then
            echo "Skipping Kotlin framework build during indexing / SwiftUI preview."
            exit 0
          fi
          cd "$SRCROOT/.."
          # `-PappFlavor` is what makes this a dev or a demo app; see BUILD_VARIANT above. The
          # fallback keeps a hand-rolled xcodebuild invocation that predates the setting working.
          ./gradlew :shared-ui:embedAndSignAppleFrameworkForXcode \
            -PappFlavor="${BUILD_VARIANT:-dev}"
