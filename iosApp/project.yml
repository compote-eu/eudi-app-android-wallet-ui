# XcodeGen spec for the KMP-spike iOS app. Regenerate the .xcodeproj with:
#   cd iosApp && xcodegen generate
# The project is generated (not committed); project.yml is the source of truth.
name: iosApp
options:
  bundleIdPrefix: eu.europa.ec.eudi.kmp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    # Generated by XcodeGen (and git-ignored, like the .xcodeproj) — project.yml stays the source of
    # truth. Regenerate with `cd iosApp && xcodegen generate`.
    info:
      path: iosApp/Info.plist
      properties:
        # Compose Multiplatform throws at launch without this:
        #   IllegalStateException: `Info.plist` doesn't have a valid
        #   `CADisableMinimumFrameDurationOnPhone` entry
        # It refuses to start rather than silently cap rendering at 60Hz on high-refresh iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # Empty dict = the default system launch screen, replacing
        # INFOPLIST_KEY_UILaunchScreen_Generation now that the plist is explicit.
        UILaunchScreen: {}
        # The OpenID4VCI authorization redirect. The authorization server will only redirect to the
        # URI registered for our client_id — `eu.europa.ec.euidi://authorization`, the same value
        # Android builds as ISSUE_AUTHORIZATION_DEEPLINK — so iOS has to claim that scheme or the
        # browser has nowhere to send the result. See `IosAuthorizationRedirects`.
        CFBundleURLTypes:
          - CFBundleURLName: eu.europa.ec.eudi.kmp.iosApp.authorization
            CFBundleURLSchemes:
              - eu.europa.ec.euidi
          # Credential offers, the same two schemes Android registers (CREDENTIAL_OFFER_SCHEME and
          # CREDENTIAL_OFFER_HAIP_SCHEME). Without these iOS never hands the link to the app at all.
          - CFBundleURLName: eu.europa.ec.eudi.kmp.iosApp.credentialOffer
            CFBundleURLSchemes:
              - openid-credential-offer
              - haip-vci
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.europa.ec.eudi.kmp.iosApp
        # NB: no GENERATE_INFOPLIST_FILE here. Compose Multiplatform requires
        # `CADisableMinimumFrameDurationOnPhone`, and Xcode's generated-plist mechanism only honours a
        # documented allowlist of INFOPLIST_KEY_* settings — an arbitrary one is silently dropped
        # (verified: the key never reached the built Info.plist). So the plist is generated from the
        # `info:` block below instead, which is also more XcodeGen-idiomatic.
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        # The Kotlin framework is built by the pre-build script below into this folder.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared-ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - SharedKit
          # System SQLite, required by the shared document layer. multipaz stores documents and
          # credentials in SQLite through `androidx.sqlite`'s NativeSQLiteDriver, which reaches
          # libsqlite3 by **cinterop**: the klib records the `sqlite3_*` symbols but carries no
          # implementation, so the final link has to resolve them and only the consuming Xcode target
          # can. Without this the app fails to link with ~23 undefined `_sqlite3_*` symbols even
          # though `:shared-ui:linkDebugFrameworkIosSimulatorArm64` succeeds — another case of a green
          # Kotlin framework link not proving the Swift app builds.
          - -lsqlite3
    preBuildScripts:
      - name: Compile Kotlin Framework (SharedKit)
        basedOnDependencyAnalysis: false
        script: |
          # Build guard: skip the Gradle task during Xcode's index build AND SwiftUI previews,
          # so the Kotlin framework isn't rebuilt (or deadlocked) outside a real build. Android
          # Studio's KMP inspection ("Missing build guard for an Xcode target") flags a
          # framework-compile script phase that doesn't guard both of these actions.
          if [ "$ACTION" = "indexbuild" ] || [ "$ENABLE_PREVIEWS" = "YES" ]; then
            echo "Skipping Kotlin framework build during indexing / SwiftUI preview."
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared-ui:embedAndSignAppleFrameworkForXcode
