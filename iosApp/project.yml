# XcodeGen spec for the iOS wallet app. Regenerate the .xcodeproj with:
#   cd iosApp && xcodegen generate
# The project is generated (not committed); project.yml is the source of truth.
name: iosApp
options:
  bundleIdPrefix: eu.europa.ec.euidi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    # Generated by XcodeGen (and git-ignored, like the .xcodeproj) — project.yml stays the source of
    # truth. Regenerate with `cd iosApp && xcodegen generate`.
    info:
      path: iosApp/Info.plist
      properties:
        # Compose Multiplatform throws at launch without this:
        #   IllegalStateException: `Info.plist` doesn't have a valid
        #   `CADisableMinimumFrameDurationOnPhone` entry
        # It refuses to start rather than silently cap rendering at 60Hz on high-refresh iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # Empty dict = the default system launch screen, replacing
        # INFOPLIST_KEY_UILaunchScreen_Generation now that the plist is explicit.
        UILaunchScreen: {}
        # The OpenID4VCI authorization redirect. The authorization server will only redirect to the
        # URI registered for our client_id — `eu.europa.ec.euidi://authorization`, the same value
        # Android builds as ISSUE_AUTHORIZATION_DEEPLINK — so iOS has to claim that scheme or the
        # browser has nowhere to send the result. See `IosAuthorizationRedirects`.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).authorization
            CFBundleURLSchemes:
              - eu.europa.ec.euidi
          # Credential offers, the same two schemes Android registers (CREDENTIAL_OFFER_SCHEME and
          # CREDENTIAL_OFFER_HAIP_SCHEME). Without these iOS never hands the link to the app at all.
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).credentialOffer
            CFBundleURLSchemes:
              - openid-credential-offer
              - haip-vci
          # Remote presentation (OpenID4VP), the same four schemes Android registers. All four,
          # because the wallet does not choose: the *verifier* builds the link, and the EUDI dev
          # verifier emits `haip-vp://` by default while its OpenID4VP profile emits `openid4vp://`.
          # See `IosDeepLinks.PRESENTATION_SCHEMES`, which must list exactly these.
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).presentation
            CFBundleURLSchemes:
              - openid4vp
              - eudi-openid4vp
              - mdoc-openid4vp
              - haip-vp
        # The QR scanner's camera. Like the Bluetooth string below, this *is* the permission: iOS
        # shows it in the prompt the first time AVFoundation is asked for the camera, and an app
        # without the key is terminated instead of prompted.
        NSCameraUsageDescription: >-
          Scan a QR code to share a document or to add one to your wallet.
        # ISO 18013-5 proximity sharing. iOS has no runtime Bluetooth permission to request; this
        # string *is* the permission — CoreBluetooth raises the system prompt with it the first time
        # the wallet advertises, and without the key the app is terminated instead of prompted.
        NSBluetoothAlwaysUsageDescription: >-
          Share documents from your wallet with a nearby reader over Bluetooth.
    settings:
      base:
        # The same identity the EUDI reference iOS wallet uses
        # (`eu-digital-identity-wallet/eudi-app-ios-wallet-ui`): `eu.europa.ec.euidi` for demo and
        # `eu.europa.ec.euidi.dev` for dev, matching Android's `applicationIdSuffix = ".dev"`.
        #
        # ⚠️ It is therefore the *same bundle id as the reference wallet*, so the two cannot be
        # installed side by side — whichever is installed second replaces the first, along with its
        # wallet data. Deliberate: this app is the KMP build of that wallet, not a companion to it.
        #
        # Nested expansion rather than two settings to keep in step: overriding BUILD_VARIANT alone
        # moves the suffix with it, so a demo build cannot end up carrying a `.dev` id.
        PRODUCT_BUNDLE_IDENTIFIER: "eu.europa.ec.euidi$(BUNDLE_ID_SUFFIX_$(BUILD_VARIANT))"
        BUNDLE_ID_SUFFIX_dev: ".dev"
        BUNDLE_ID_SUFFIX_demo: ""
        # Which of Android's two product flavours this build mirrors, named as the reference iOS
        # wallet names it (`BUILD_VARIANT` in its `Wallet*.xcconfig`). Passed straight through to
        # Gradle as `-PappFlavor` by the pre-build script below, which is what selects
        # `shared-logic/src/iosDevMain` or `src/iosDemoMain`.
        #
        # `dev` by default, matching `assembleDevDebug` and every documented probe run. Build the
        # other flavour with:
        #   xcodebuild ... BUILD_VARIANT=demo
        # Xcode caches the framework per configuration, not per setting, so switch flavours with a
        # clean build (or `./gradlew clean`) — a stale SharedKit is the one way to get a dev framework
        # inside a demo app.
        BUILD_VARIANT: dev
        # NB: no GENERATE_INFOPLIST_FILE here. Compose Multiplatform requires
        # `CADisableMinimumFrameDurationOnPhone`, and Xcode's generated-plist mechanism only honours a
        # documented allowlist of INFOPLIST_KEY_* settings — an arbitrary one is silently dropped
        # (verified: the key never reached the built Info.plist). So the plist is generated from the
        # `info:` block below instead, which is also more XcodeGen-idiomatic.
        SWIFT_VERSION: "6.0"
        # Ad-hoc signing rather than none: an unsigned app has no entitlements at all, and the Keychain
        # then refuses every `SecItem` call with -34018 (errSecMissingEntitlement) — which is where the
        # wallet's PIN lives. "-" needs no development team, so this still builds on any machine.
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # The Kotlin framework is built by the pre-build script below into this folder.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared-ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - SharedKit
          # System SQLite, required by the shared document layer. multipaz stores documents and
          # credentials in SQLite through `androidx.sqlite`'s NativeSQLiteDriver, which reaches
          # libsqlite3 by **cinterop**: the klib records the `sqlite3_*` symbols but carries no
          # implementation, so the final link has to resolve them and only the consuming Xcode target
          # can. Without this the app fails to link with ~23 undefined `_sqlite3_*` symbols even
          # though `:shared-ui:linkDebugFrameworkIosSimulatorArm64` succeeds — another case of a green
          # Kotlin framework link not proving the Swift app builds.
          - -lsqlite3
    preBuildScripts:
      - name: Compile Kotlin Framework (SharedKit)
        basedOnDependencyAnalysis: false
        script: |
          # Build guard: skip the Gradle task during Xcode's index build AND SwiftUI previews,
          # so the Kotlin framework isn't rebuilt (or deadlocked) outside a real build. Android
          # Studio's KMP inspection ("Missing build guard for an Xcode target") flags a
          # framework-compile script phase that doesn't guard both of these actions.
          if [ "$ACTION" = "indexbuild" ] || [ "$ENABLE_PREVIEWS" = "YES" ]; then
            echo "Skipping Kotlin framework build during indexing / SwiftUI preview."
            exit 0
          fi
          cd "$SRCROOT/.."
          # `-PappFlavor` is what makes this a dev or a demo app; see BUILD_VARIANT above. The
          # fallback keeps a hand-rolled xcodebuild invocation that predates the setting working.
          ./gradlew :shared-ui:embedAndSignAppleFrameworkForXcode \
            -PappFlavor="${BUILD_VARIANT:-dev}"
