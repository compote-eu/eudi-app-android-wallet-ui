# Single source of truth for the app's IDENTITY on BOTH platforms — its name and its id.
# Analogous to version.properties, which owns the version. Read by:
#
#   Android  build-logic's `configureFlavors` -> manifestPlaceholders["appName"]/["appNameSuffix"]
#            and applicationIdSuffix; `AndroidLibraryConventionPlugin` -> the OpenID4VCI scheme
#   iOS      iosApp/project.yml, through XcodeGen's generate-time `${...}` expansion, so a change
#            here needs `./gradlew generateIosProject` to reach the Xcode project
#
# The per-variant suffix keys are named APP_*_SUFFIX_<variant>, where <variant> is the Android product
# flavour name lowercased — which is also iOS's BUILD_VARIANT. iOS composes them with the nested
# expansion `$(APP_NAME_SUFFIX_$(BUILD_VARIANT))`, so overriding BUILD_VARIANT alone moves both the
# name and the id together. Every flavour needs an entry in each set; `AppIdentityParityTest` fails if
# one is missing, because a missing key silently yields the unsuffixed value on iOS.

# The launcher name. Both variants are named identically, as upstream does and as the official native
# iOS wallet does (INFOPLIST_KEY_CFBundleDisplayName = "EUDI Wallet" in all four of its app configs).
# The suffix mechanism exists for when that changes; leave the values empty to keep upstream behaviour.
APP_NAME=EUDI Wallet
APP_NAME_SUFFIX_dev=
APP_NAME_SUFFIX_demo=

# The application id / bundle id.
#
# ⚠️ CHANGED for team signing: this was `eu.europa.ec.euidi`, the identifier the official native iOS
# wallet uses. App IDs are globally unique and that namespace is the European Commission's, so it
# cannot be registered under our own Apple Developer team — and without a registered App ID there is
# no provisioning profile, no honoured entitlement, and therefore no Digital Credentials registration
# (the OS answers `notAuthorized`). Moving it is what unblocks that.
#
# Two consequences worth knowing:
#   • The app no longer collides with the reference wallet, so both can be installed side by side —
#     the previous comment here noted they could not, and that was a deliberate cost of matching them.
#   • Every id derived from this moves with it: the app-group container, and therefore the wallet
#     database, and the document-provider extension's own id. Existing installs see an empty wallet;
#     there is no migration and none is wanted, see `MultipazWalletStore.storeFileUrl`.
APP_ID=eu.compote.euidi
APP_ID_SUFFIX_dev=.dev
APP_ID_SUFFIX_demo=

# The OpenID4VCI authorization redirect scheme. Equal to APP_ID today but deliberately NOT derived
# from it: the authorization server only redirects to the URI registered against our client_id, and
# the dev flavour's app id carries `.dev` while this must not. Deriving it would break issuance on dev
# only — which is the flavour everything is tested on. Guarded by DeepLinkSchemeParityTest.
OID4VCI_REDIRECT_SCHEME=eu.europa.ec.euidi

# ── Three look-alikes that are deliberately NOT here, and must stay literals ──────────────────────
#   androidApp's `namespace`      the R/BuildConfig package. Never suffixed, and moving it moves
#                                generated classes.
#   BGTaskSchedulerPermittedIdentifiers   `eu.europa.ec.euidi.reissuance` in iosApp/project.yml names
#                                the WORK, not the app, so dev and demo ask for the same task.
#   keystore/signing identifiers  unrelated to the app id.
