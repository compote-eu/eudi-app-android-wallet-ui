# Local EU ARF services for the `local` build flavor.
#
# A Caddy reverse proxy terminates TLS on the ports the app expects, using the dev-CA
# cert generated by `./gradlew :network-logic:generateLocalServerCert` — so the wallet
# (which bundles that CA) trusts every service. Backends themselves speak plain HTTP.
#
#   app -> https://${LOCAL_IP}:8443  -> proxy -> issuer:5000
#   app -> https://${LOCAL_IP}:8445  -> proxy -> wallet-provider:8080
#
# Only the issuer and wallet-provider are wired here (the two services the `local`
# flavor needs). See README.md for the required config/keys before `docker compose up`.
#
# Prerequisites (see README.md):
#   1. cp .env.example .env  and set LOCAL_IP to your LAN IP (matches local.properties)
#   2. generate the TLS cert:  ../gradlew :network-logic:generateLocalServerCert -PhostIp=<ip>
#   3. provide issuer config + Document Signer keys under config/issuer/
#   4. provide wallet-provider signing keystore + DB schemas under config/wallet-provider/

name: eudi-local-services

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8443:8443"   # issuer          -> app: https://${LOCAL_IP}:8443
      - "8444:8444"   # issuer FormEU frontend UI
      - "8445:8445"   # wallet-provider -> app: https://${LOCAL_IP}:8445
      - "8446:8446"   # trusted list    (profile: trustedlist)
      - "8447:8447"   # verifier API    (profile: verifier)
      - "8448:8448"   # verifier UI     (profile: verifier)
      - "8449:8449"   # RQES signer     (profile: rqes)
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Mount the whole dev-CA dir (not individual files) so a regenerated cert — e.g. after
      # a LAN/IP change — propagates reliably. Single-file bind mounts go stale on Docker
      # Desktop when the file is replaced. Caddy reads /certs/server.crt + /certs/server.key.
      - ../network-logic/.local-dev-ca:/certs:ro
    depends_on:
      - issuer
      - wallet-provider

  issuer:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-web-issuing-eudiw-py:latest
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      ISSUER_CONFIG_PATH: /etc/issuer_config/config_issuer_backend.yaml
      # Trust the dev CA for the issuer's own HTTPS callbacks (OIDC introspection,
      # token-status-list revocation) to https://${LOCAL_IP}:8443/...
      REQUESTS_CA_BUNDLE: /certs/ca.crt
      SSL_CERT_FILE: /certs/ca.crt
      CURL_CA_BUNDLE: /certs/ca.crt
    volumes:
      - ./config/issuer/config_issuer_backend.yaml:/etc/issuer_config/config_issuer_backend.yaml:ro
      # Document Signer cert + private key used to sign issued credentials:
      - ./config/issuer/cert/:/etc/eudiw/pid-issuer-dev/cert/:ro
      - ./config/issuer/privKey/:/etc/eudiw/pid-issuer-dev/privKey/:ro
      # Local override of ALL credential metadata: ensures every proof type declares
      # key_attestations_required (the app's OpenID4VCI SDK requires the field to be present,
      # otherwise "add from list" fails to parse the metadata).
      - ./config/issuer/credentials_supported:/app/app/metadata_config/credentials_supported:ro
      - ../network-logic/.local-dev-ca/ca.crt:/certs/ca.crt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${LOCAL_IP}:host-gateway"

  # Token Status List service (eudi-srv-statuslist-py, build-from-source). The
  # wallet-provider calls it to mint status tokens for wallet/key attestations, and the
  # issuer calls it for credential revocation status. Trimmed to the FC country locally.
  statuslist:
    build: ./repos/eudi-srv-statuslist-py
    restart: unless-stopped
    environment:
      API_key: "${STATUSLIST_API_KEY}"
      FLASK_APP: app
    expose:
      - "5000"
    volumes:
      - ./config/statuslist/privKey:/etc/eudiw/pid-issuer/privKey:ro
      - ./config/statuslist/cert:/etc/eudiw/pid-issuer/cert:ro
      - statuslist-data:/var/opt

  # Issuer FormEU frontend web UI (country/auth-method selection pages). The backend's
  # auth flow redirects the browser here (/display_auth_method, /display_countries).
  issuer-frontend:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-web-issuing-frontend-eudiw-py:latest
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      # Trust the dev CA so the frontend's HTTPS fetch of the backend metadata succeeds.
      REQUESTS_CA_BUNDLE: /certs/ca.crt
      SSL_CERT_FILE: /certs/ca.crt
      CURL_CA_BUNDLE: /certs/ca.crt
    volumes:
      - ./config/issuer-frontend/frontend_config.yaml:/etc/issuer_config/frontend_config.yaml:ro
      - ../network-logic/.local-dev-ca/ca.crt:/certs/ca.crt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Reach the host's LAN IP (and its cert SAN) from inside the container.
      - "${LOCAL_IP}:host-gateway"

  # OpenID4VCI authorization server (advertised at /oidc). Serves /oidc/* endpoints
  # and the RFC8414 metadata; validates the wallet's client attestation.
  issuer-oidc:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-issuer-oidc-py:latest
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ./config/issuer-oidc/config.json:/etc/issuer_config/authorization_config.json:ro
      - ./config/issuer-oidc/oidc_trusted_attesters:/etc/eudiw/pid-issuer/oidc_trusted_attesters:ro
      # Localized static metadata + one hardcoded URL patched (dev.issuer.eudiw.dev -> LOCAL_IP)
      - ./config/issuer-oidc/openid-configuration.json:/app/openid-configuration.json:ro
      - ./config/issuer-oidc/views.py:/app/views.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  wallet-provider:
    # Host-native image built from source by bootstrap.sh step 8 (Jib). Upstream only
    # publishes linux/amd64, which runs emulated/slow on Apple Silicon; this is built for
    # the host arch instead. `pull_policy: never` => a clear error (not a registry pull)
    # if it hasn't been built. Rebuild with: FORCE_WP_BUILD=1 ./bootstrap.sh --skip-app
    image: eudi-srv-wallet-provider:local
    pull_policy: never
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      # Public URL the wallet-provider advertises = the HTTPS proxy address:
      ISSUER_PUBLICURL: "https://${LOCAL_IP}:8445"
      DATABASE_URL: "r2dbc:pool:postgresql://wallet-db:5432/wallet-provider"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "${WALLET_DB_PASSWORD}"
      # TODO: EC (ES256) signing keystore for wallet attestations (see README.md).
      # Its public key must be trusted by the issuer (attestation-based client auth).
      SIGNINGKEY_KEYSTOREFILE: /keys/signing.p12
      SIGNINGKEY_KEYSTOREPASSWORD: "${SIGNINGKEY_PASSWORD}"
      SIGNINGKEY_KEYALIAS: "wallet-provider"
      SIGNINGKEY_KEYPASSWORD: "${SIGNINGKEY_PASSWORD}"
      SIGNINGKEY_ALGORITHM: "ES256"
      # Wallet Instance Attestation metadata (advertised in issued WIAs).
      WALLETINSTANCEATTESTATION_WALLETNAME: "EUDI Wallet (local)"
      WALLETINSTANCEATTESTATION_WALLETVERSION: "1.0.0"
      WALLETINSTANCEATTESTATION_WALLETSOLUTIONCERTIFICATIONINFORMATION: "local-dev"
      # Key attestation: URL of the key-storage certification (placeholder for local dev).
      KEYATTESTATION_CERTIFICATION: "https://${LOCAL_IP}:8445/key-attestation/certification"
      # Platform (Android/iOS) key-attestation validation is left DISABLED for local dev
      # (optional in config) so emulator / debug keys are accepted.
      # Token Status List service (eudi-srv-statuslist-py — see the `statuslist` service).
      TOKENSTATUSLISTSERVICE_SERVICEURL: "http://statuslist:5000/token_status_list/take"
      TOKENSTATUSLISTSERVICE_APIKEY: "${STATUSLIST_API_KEY}"
      TOKENSTATUSLISTSERVICE_COUNTRY: "FC"
    volumes:
      - ./config/wallet-provider/signing.p12:/keys/signing.p12:ro
    depends_on:
      wallet-db:
        condition: service_healthy

  wallet-db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallet-provider
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${WALLET_DB_PASSWORD}"
    volumes:
      # TODO: copy schemas/postgresql from the wallet-provider repo (see README.md).
      - ./config/wallet-provider/schemas/postgresql:/docker-entrypoint-initdb.d:ro
      # Postgres 18+ stores data in a version subdir; mount the parent, not .../data.
      - wallet-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet-provider"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------------------
  # OPTIONAL services — not started by default. Enable with a profile, e.g.:
  #   docker compose --profile verifier up -d
  #   docker compose --profile trustedlist up -d
  #   docker compose --profile rqes up -d
  # (Combine with the core services, which always run.)
  # ---------------------------------------------------------------------------------------

  # --- Verifier (image-based: backend + web UI). Proxy: 8447 API, 8448 UI. ---------------
  verifier:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-verifier-endpoint:latest
    profiles: ["verifier"]
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      VERIFIER_PUBLICURL: "https://${LOCAL_IP}:8447"
      VERIFIER_DEFAULTHTTPRESPONSEMODE: "DirectPost"
      VERIFIER_ACCESS_CERTIFICATE_SIGNING_ALGORITHM: "ES512"
    volumes:
      # TODO: verifier access-certificate keystore (JKS/PKCS12). You can generate one with:
      #   ./gradlew :network-logic:generateWalletProviderSigningKey  (then move/rename), or
      #   scripts/generate-signing-keystore.sh config/verifier/keystore.jks verifier <pw>
      - ./config/verifier/keystore.jks:/certs/keystore.jks:ro

  verifier-ui:
    image: ghcr.io/eu-digital-identity-wallet/eudi-web-verifier:latest
    profiles: ["verifier"]
    restart: unless-stopped
    expose:
      - "4300"
    environment:
      DOMAIN_NAME: ""
      HOST_API: "https://${LOCAL_IP}:8447"

  # --- Trusted list manager (build from source; needs its own DB). Proxy: 8446. ----------
  # Clone first:  git clone https://github.com/eu-digital-identity-wallet/eudi-srv-web-trustedlist-manager-py repos/eudi-srv-web-trustedlist-manager-py
  trustedlist:
    build: ./repos/eudi-srv-web-trustedlist-manager-py
    profiles: ["trustedlist"]
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      SERVICE_URL: "https://${LOCAL_IP}:8446"
      TRUSTED_CAS_PATH: "/app/trusted_CAs"
      LOG_PATH: "/tmp/log"
      # TODO: XML signing cert + key for the trusted list (place under config/trustedlist/):
      CERT: "/app/keys/tl-sign.crt"
      PRIV_KEY: "/app/keys/tl-sign.key"
      VERIFIER: "https://${LOCAL_IP}:8447"
      DB_HOST: "trustedlist-db"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "${TRUSTEDLIST_DB_PASSWORD}"
      DB_NAME: "trustedlist"
    volumes:
      - ./config/trustedlist:/app/keys:ro
    depends_on:
      trustedlist-db:
        condition: service_healthy

  trustedlist-db:
    image: postgres:18.3-alpine
    profiles: ["trustedlist"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustedlist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${TRUSTEDLIST_DB_PASSWORD}"
    volumes:
      - trustedlist-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustedlist"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- RQES: TrustProvider Signer (software-key mode — no HSM/EJBCA). Proxy: 8449. -------
  # The realistic local RQES for a plain machine: since v0.5.0 this signer falls back to
  # BouncyCastle software keys and a local CA when no HSM/EJBCA is configured. It implements
  # the CSC/RSSP signing interface. Build-from-source — clone + configure its .env first:
  #   git clone https://github.com/eu-digital-identity-wallet/eudi-srv-web-trustprovider-signer-java repos/trustprovider-signer
  #   cp repos/trustprovider-signer/.env.example repos/trustprovider-signer/.env   # then edit (see README)
  # Point that .env's DB at host `rqes-db` with the RQES_DB_* creds from OUR .env, and leave
  # HSM/EJBCA unset (software fallback). Enable with:  docker compose --profile rqes up -d
  #
  # NOTE: this is a different implementation than the demo's wallet-driven QTSP, so verify
  # the CSC base path and repoint RQESConfigImpl.kt (local alt) at https://${LOCAL_IP}:8449.
  rqes-signer:
    build:
      context: ./repos/trustprovider-signer/server
      dockerfile: app/Dockerfile
    profiles: ["rqes"]
    restart: unless-stopped
    env_file:
      - path: ./repos/trustprovider-signer/.env
        required: false
    expose:
      - "8082"
    depends_on:
      rqes-db:
        condition: service_healthy

  rqes-sa:
    build:
      context: ./repos/trustprovider-signer/server
      dockerfile: sa/Dockerfile
    profiles: ["rqes"]
    restart: unless-stopped
    env_file:
      - path: ./repos/trustprovider-signer/.env
        required: false
    expose:
      - "8083"
    depends_on:
      - rqes-signer

  rqes-db:
    image: mysql/mysql-server:latest
    profiles: ["rqes"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${RQES_DB_NAME:-signer}"
      MYSQL_USER: "${RQES_DB_USER:-signer}"
      MYSQL_PASSWORD: "${RQES_DB_PASSWORD:-signer}"
      MYSQL_ROOT_PASSWORD: "${RQES_DB_ROOT_PASSWORD:-rootpw}"
    volumes:
      - rqes-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  wallet-db-data:
  trustedlist-db-data:
  rqes-db-data:
  statuslist-data:
