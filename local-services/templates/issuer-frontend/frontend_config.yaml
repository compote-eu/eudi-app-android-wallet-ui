# Issuer frontend (eudi-srv-web-issuing-frontend-eudiw-py v0.11.0) for the local stack.
# Rendered by bootstrap.sh into config/issuer-frontend/frontend_config.yaml (git-ignored).
# Since v0.11.0 the credentials it publishes are configured in the backend
# (frontend.frontends_config), and the authorization server comes from the backend's metadata.

# The credential issuer identifier the wallet uses (the app's issuerUrl).
service_url: "https://__LOCAL_IP__:8444"
log_dir: "/tmp/issuer_frontend/logs/logs.log"

frontend_id: "5d725b3c-6d42-448e-8bfd-1eff1fcf152d"

backend_url: "https://__LOCAL_IP__:8443"
# The backend's backend_api_key (sent when the frontend reads its metadata).
backend_api_key: "__ISSUER_BACKEND_API_KEY__"
# The backend's payload_key for this frontend (verifies the /display_* payloads).
payload_key: "__ISSUER_PAYLOAD_KEY__"
